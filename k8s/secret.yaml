apiVersion: v1
kind: Secret
metadata:
  name: gagent-secrets
  labels:
    app: gagent
    component: gstack
type: Opaque
stringData:
  postgres-url: "postgres://gagent:gagent_password@postgres:5432/gstack"
  anthropic-api-key: "your-anthropic-api-key-here"
  openai-api-key: "your-openai-api-key-here"
