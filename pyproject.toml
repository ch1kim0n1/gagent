[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gagent"
version = "0.5.0"
description = "Unified CLI for the six-tool agent stack (Node.js tool, installable via pip)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "ch1kim0n1" }]
keywords = ["agent", "llm", "multi-model", "pipeline", "ai-agent", "cli", "mcp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: JavaScript",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]

[project.urls]
Repository = "https://github.com/ch1kim0n1/gagent"
Homepage = "https://github.com/ch1kim0n1/gagent#readme"
Issues = "https://github.com/ch1kim0n1/gagent/issues"

[project.scripts]
gagent = "gagent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["python/gagent"]
# Ship the bundled JS + WASM sidecar (non-.py files) as package data.
artifacts = [
    "python/gagent/_bundle/gagent.cli.js",
    "python/gagent/_bundle/tiktoken_bg.wasm",
]

[tool.hatch.build.targets.sdist]
include = [
    "python/gagent",
    "README.md",
    "pyproject.toml",
    "scripts/build_pypi.sh",
]
